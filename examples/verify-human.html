<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustLayer — verifyHuman()</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; background: #0b0c10; color: #e8e9ef; padding: 40px 20px; }
    a { color: #6d7cff; }
    .card { max-width: 560px; margin: 0 auto; background: #14151b; border: 1px solid #262833; border-radius: 16px; padding: 28px; }
    label { display: block; font-size: 13px; color: #a9adc0; margin: 12px 0 6px; }
    input[type="text"] { width: 100%; box-sizing: border-box; background: #0b0c10; border: 1px solid #262833; border-radius: 8px; padding: 10px; color: inherit; }
    button { margin-top: 16px; background: #6d7cff; color: #0b0c10; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    pre { background: #0b0c10; border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 14px; }
    .hint { color: #a9adc0; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>verifyHuman()</h1>
    <p class="hint">
      Loads the SDK IIFE from <code>../dist/trustlayer.iife.global.js</code>.
      Serve this folder (not <code>file://</code>) after <code>npm run build</code>.
      For the GPU webcam demo, use
      <a href="http://127.0.0.1:8001/demo">http://127.0.0.1:8001/demo</a>.
    </p>
    <label>API URL</label>
    <input id="apiUrl" type="text" value="http://127.0.0.1:8080" />
    <label>Public API key</label>
    <input id="apiKey" type="text" value="tl_public_demodemo12DEADBEEF00000001" />
    <div class="row">
      <input id="consent" type="checkbox" />
      <label for="consent" style="margin:0">I consent to camera / mic for a live-human check</label>
    </div>
    <button id="run">Run TrustLayer.verifyHuman()</button>
    <pre id="out">Waiting…</pre>
  </div>
  <script src="../dist/trustlayer.iife.global.js"></script>
  <script>
    const out = document.getElementById("out");
    document.getElementById("run").onclick = async () => {
      if (!window.TrustLayerSDK) {
        out.textContent = "Bundle missing. From TrustLayerSDK run: npm run build";
        return;
      }
      const consent = document.getElementById("consent").checked;
      if (!consent) {
        out.textContent = "Check consent first.";
        return;
      }
      const tl = TrustLayerSDK.TrustLayer.initialize({
        apiKey: document.getElementById("apiKey").value,
        apiUrl: document.getElementById("apiUrl").value,
      });
      out.textContent = "Running…";
      try {
        const result = await tl.verifyHuman({ type: "interview", consent: true });
        out.textContent = JSON.stringify({
          session_id: result.session_id,
          human_probability: result.human_probability,
          recommendation: result.recommendation,
          deepfake_risk: result.deepfake_risk,
          reasons: result.reasons,
        }, null, 2);
      } catch (err) {
        out.textContent = err && err.message ? err.message : String(err);
      }
    };
  </script>
</body>
</html>
